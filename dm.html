<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPA Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#0b0b12;
  --rose:#ff2d9b;
  --mauve:#7c3aed;
  --text:#fff;
  --border:rgba(255,255,255,0.08);
}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* =========================
   APP WRAPPER
========================= */
.app{
  position:relative;
  height:100vh;
  width:100%;
}

/* =========================
   HEADER
========================= */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  margin:10px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
}

/* =========================
   VIEWS SYSTEM
========================= */
.view{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  flex-direction:column;
}

.view.active{
  display:flex;
}

/* =========================
   LIST
========================= */
.list{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow:auto;
  flex:1;
}

.item{
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  cursor:pointer;
}

/* =========================
   CHAT
========================= */
.chat-box{
  flex:1;
  overflow:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.msg{
  padding:10px;
  border-radius:12px;
  max-width:70%;
}

.me{
  background:linear-gradient(45deg,var(--rose),var(--mauve));
  margin-left:auto;
}

/* =========================
   INPUT
========================= */
.input-row{
  display:flex;
  gap:10px;
  padding:10px;
  border-top:1px solid var(--border);
}

.input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

.send{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:linear-gradient(45deg,var(--rose),var(--mauve));
  color:#fff;
}

</style>
</head>

<body>

<div class="app">

  <!-- =========================
       LIST VIEW
  ========================= -->
  <div class="view active" id="listView">

    <div class="header">
      <div>☰</div>
      <div>الرسائل</div>
      <div>💬</div>
    </div>

    <div class="list">

      <div class="item" onclick="openChat('أحمد')">
        أحمد
      </div>

      <div class="item" onclick="openChat('محمد')">
        محمد
      </div>

    </div>

  </div>

  <!-- =========================
       CHAT VIEW
  ========================= -->
  <div class="view" id="chatView">

    <div class="header">
      <div onclick="back()">⬅</div>
      <div id="chatName">شات</div>
      <div>💬</div>
    </div>

    <div class="chat-box" id="box"></div>

    <div class="input-row">
      <input class="input" id="input" placeholder="اكتب رسالة...">
      <button class="send" onclick="send()">إرسال</button>
    </div>

  </div>

</div>

<script>

let currentChat = "";

/* =========================
   NAVIGATION (SPA)
========================= */
function show(view){
  document.querySelectorAll(".view")
  .forEach(v => v.classList.remove("active"));

  document.getElementById(view).classList.add("active");
}

/* =========================
   OPEN CHAT
========================= */
function openChat(name){
  currentChat = name;
  document.getElementById("chatName").innerText = name;
  show("chatView");
}

/* =========================
   BACK
========================= */
function back(){
  show("listView");
}

/* =========================
   SEND MESSAGE
========================= */
function send(){

  const input = document.getElementById("input");
  const box = document.getElementById("box");

  const text = input.value.trim();
  if(!text) return;

  const msg = document.createElement("div");
  msg.className = "msg me";
  msg.textContent = text;

  box.appendChild(msg);

  input.value = "";
  box.scrollTop = box.scrollHeight;
}

</script>

</body>
</html>
