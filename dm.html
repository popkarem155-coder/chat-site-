<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الرسائل الخاصة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:#0b0b12;
  color:#fff;
}

/* نفس ستايل بسيط خاص بالـ DM */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  margin:10px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
}

.section{
  margin:10px;
  padding:10px;
  border-radius:14px;
  background:rgba(255,255,255,0.04);
}

.user{
  padding:10px;
  margin:6px 0;
  background:rgba(255,255,255,0.06);
  border-radius:10px;
  cursor:pointer;
}

/* الشات */
.chat{
  display:none;
  flex-direction:column;
  height:100vh;
}

.chat-box{
  flex:1;
  padding:10px;
  overflow-y:auto;
}

.msg{
  padding:10px;
  margin:6px 0;
  border-radius:10px;
}

.me{
  background:linear-gradient(45deg,#ff2d9b,#7c3aed);
  margin-left:auto;
  width:fit-content;
}

.him{
  background:rgba(255,255,255,0.1);
  width:fit-content;
}

.input-row{
  display:flex;
  gap:10px;
  padding:10px;
}

.input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:#7c3aed;
  color:#fff;
}
</style>

</head>

<body class="dm">

<!-- 🔝 HEADER -->
<div class="header">
  <div onclick="goBack()">⬅ رجوع</div>
  <div>الرسائل</div>
  <div>💬</div>
</div>

<!-- 📩 INBOX -->
<div id="inbox">

  <div class="section">
    <div class="user" onclick="openChat('أحمد')">
      أحمد - آخر رسالة...
    </div>

    <div class="user" onclick="openChat('محمد')">
      محمد - تمام 👌
    </div>
  </div>

</div>

<!-- 💬 CHAT -->
<div id="chat" class="chat">

  <div class="header">
    <div onclick="goBack()">⬅</div>
    <div id="chatName">شخص</div>
    <div>💬</div>
  </div>

  <div class="chat-box" id="box"></div>

  <div class="input-row">
    <input class="input" id="input" placeholder="اكتب رسالة...">
    <button onclick="send()">إرسال</button>
  </div>

</div>

<script>
let current = "";

function openChat(name){
  current = name;

  document.getElementById("inbox").style.display = "none";
  document.getElementById("chat").style.display = "flex";
  document.getElementById("chatName").innerText = name;
}

function goBack(){
  document.getElementById("inbox").style.display = "block";
  document.getElementById("chat").style.display = "none";
}

function send(){
  const input = document.getElementById("input");
  const box = document.getElementById("box");

  const text = input.value.trim();
  if(text === "") return;

  const msg = document.createElement("div");
  msg.className = "msg me";
  msg.textContent = text;

  box.appendChild(msg);

  input.value = "";
  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
