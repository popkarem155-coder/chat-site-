<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرسائل الخاصة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   ⚙️ CORE
========================= */
:root{
  --bg:#0b0b12;
  --rose:#ff2d9b;
  --mauve:#7c3aed;
  --text:#fff;
  --border:rgba(255,255,255,0.08);
}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =========================
   🧩 HEADER
========================= */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  margin:10px;
  border-radius:16px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
}

.back{
  cursor:pointer;
  font-size:18px;
}

.title{
  font-weight:bold;
}

/* =========================
   🔍 SEARCH
========================= */
.search{
  width:calc(100% - 20px);
  margin:10px;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:transparent;
  color:#fff;
  outline:none;
}

/* =========================
   📩 INBOX LIST
========================= */
.list{
  margin:10px;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  margin-bottom:8px;
  border-radius:14px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  cursor:pointer;
}

.last{
  font-size:12px;
  opacity:0.7;
}

/* =========================
   💬 CHAT ROOM (مخفي في البداية)
========================= */
.chat{
  display:none;
  flex-direction:column;
  height:100vh;
  width:100%;
  position:fixed;
  top:0;
  left:0;
  background:#0b0b12;
}

.chat-box{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  padding:10px;
  margin:6px;
  border-radius:12px;
  max-width:70%;
}

/* رسالتي */
.me{
  background:linear-gradient(45deg,var(--rose),var(--mauve));
  margin-left:auto;
}

/* رسالة الطرف الآخر */
.him{
  background:rgba(255,255,255,0.1);
}

/* =========================
   ⌨️ INPUT
========================= */
.input-row{
  display:flex;
  gap:10px;
  padding:10px;
  border-top:1px solid var(--border);
  background:#0b0b12;
}

.input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

.send{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:linear-gradient(45deg,var(--rose),var(--mauve));
  color:#fff;
}

</style>
</head>

<body>

<!-- 🔝 HEADER -->
<div class="header">
  <div class="back" onclick="goBack()">⬅ رجوع</div>
  <div class="title">الرسائل الخاصة</div>
  <div>💬</div>
</div>

<!-- 🔍 SEARCH -->
<input class="search" placeholder="ابحث في المحادثات...">

<!-- 📩 LIST -->
<div class="list" id="list">

  <div class="item" onclick="openChat('أحمد')">
    <div>
      <div>أحمد</div>
      <div class="last">آخر رسالة...</div>
    </div>
    <div>12:30</div>
  </div>

  <div class="item" onclick="openChat('محمد')">
    <div>
      <div>محمد</div>
      <div class="last">تمام 👌</div>
    </div>
    <div>11:10</div>
  </div>

</div>

<!-- 💬 CHAT -->
<div class="chat" id="chat">

  <div class="header">
    <div class="back" onclick="closeChat()">⬅</div>
    <div id="chatName">شخص</div>
    <div>💬</div>
  </div>

  <div class="chat-box" id="box"></div>

  <div class="input-row">
    <input class="input" id="input" placeholder="اكتب رسالة...">
    <button class="send" onclick="send()">إرسال</button>
  </div>

</div>

<script>

let current = "";

function openChat(name){
  current = name;

  document.getElementById("list").style.display = "none";
  document.getElementById("chat").style.display = "flex";
  document.getElementById("chatName").innerText = name;
}

function closeChat(){
  document.getElementById("list").style.display = "block";
  document.getElementById("chat").style.display = "none";
}

function goBack(){
  // نفس الرجوع (ممكن تربطه بالهوم بعدين)
  alert("رجوع للهوم");
}

function send(){

  const input = document.getElementById("input");
  const box = document.getElementById("box");

  const text = input.value.trim();
  if(text === "") return;

  const msg = document.createElement("div");
  msg.className = "msg me";
  msg.textContent = text;

  box.appendChild(msg);

  input.value = "";
  box.scrollTop = box.scrollHeight;
}

</script>

</body>
</html>
