<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شات نار</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* (كل الـ CSS زي ما هو بدون تغيير) */
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">

  <div class="icon-btn">☰</div>

  <div class="title">شات نار</div>

  <!-- 🔥 ده بس يبقى تحويل للرسائل -->
  <div class="icon-btn" onclick="window.location.href='dm.html'">💬</div>

</div>

<!-- باقي الصفحة زي ما هو -->
<div class="section">
  <form class="search-form" onsubmit="return false;">
    <input class="search" placeholder="ابحث عن مستخدم...">
  </form>
</div>

<div class="section">
  <h3>المتصلون الآن</h3>
  <div class="user">مستخدم 1</div>
  <div class="user">مستخدم 2</div>
</div>

<div class="section">
  <h3>المستخدمين المميزين</h3>
  <div class="user">مستخدم مميز</div>
</div>

<div class="section">
  <h3>الشات العام</h3>

  <div class="chat-box"></div>

  <div class="input-row">
    <input class="input chat-input" placeholder="اكتب رسالة...">
    <button class="send">إرسال</button>
  </div>
</div>

<script>
const chatInput = document.querySelector(".chat-input");
const sendBtn = document.querySelector(".send");
const chatBox = document.querySelector(".chat-box");

function sendMessage(){
  const text = chatInput.value.trim();
  if(text === "") return;

  const msg = document.createElement("div");
  msg.className = "user";
  msg.textContent = text;

  chatBox.appendChild(msg);

  chatInput.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;
  chatInput.focus();
}

sendBtn.addEventListener("click", sendMessage);

chatInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
