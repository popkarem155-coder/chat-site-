<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>شات نار</title>

  <!-- 🎨 CSS -->
  <link rel="stylesheet" href="home.css">
</head>

<body>

<!-- 🔝 HEADER -->
<header class="header">

  <div class="left">
    <button onclick="openMessages()">💬 الرسائل</button>
  </div>

  <div class="center">
    🔥 شات نار
  </div>

  <div class="right">
    <button onclick="toggleMenu()">👤</button>

    <!-- 👤 MENU -->
    <div id="menu" class="menu hidden">
      <div class="user">
        <div class="avatar"></div>
        <div class="name">اسم المستخدم</div>
      </div>

      <button>🔔 الإشعارات</button>
      <button>⚙️ الإعدادات</button>
      <button>🚪 تسجيل الخروج</button>
    </div>

  </div>

</header>

<!-- 🔎 SEARCH -->
<div class="search">
  <input placeholder="ابحث عن مستخدم...">
</div>

<!-- 🟢 ONLINE -->
<section class="block">
  <h2>المتصلين الآن</h2>
</section>

<!-- ⭐ FEATURED -->
<section class="block">
  <h2>المستخدمين المميزين</h2>
</section>

<!-- 💬 PUBLIC CHAT -->
<section class="block chat">
  <h2>الشات العام</h2>

  <div id="chatBox" class="chatBox"></div>

  <input id="msg" placeholder="اكتب رسالة...">
  <button onclick="sendMsg()">إرسال</button>
</section>

<!-- ⚙️ JS -->
<script src="home.js"></script>

</body>
</html>
