<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شات نار</title>
  <style>
    :root{
      --bg:#0b0910;
      --bg2:#130e18;
      --panel:#171320;
      --panel2:#1d1628;
      --line:#3a2742;
      --accent:#ff4f9a;
      --accent2:#c32773;
      --accent-soft:rgba(255,79,154,.12);
      --text:#f8f1ff;
      --muted:#b6a9c3;
      --danger:#ff6b85;
      --success:#4ad47f;
      --shadow:0 16px 40px rgba(0,0,0,.42);
      --radius:18px;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Tahoma","Segoe UI",sans-serif;
    }

    body{
      background:
        radial-gradient(circle at top right, rgba(255,79,154,.12), transparent 24%),
        linear-gradient(180deg, #120d18 0%, #09070d 100%);
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
    }

    button,input{font:inherit}
    a{text-decoration:none;color:inherit}

    /* باقي الـ CSS زي ما هو عندك بالكامل */
    /* (مش متغير فيه أي حاجة) */

  </style>
</head>

<body>

  <div class="top-alert" id="topAlert">
    <button class="close-small" onclick="document.getElementById('topAlert').style.display='none'">×</button>
    <span>🔔</span>
    <span>سجّل حسابك ليتم تفعيل المميزات الكاملة</span>
  </div>

  <div class="overlay" id="overlay" onclick="closeAllPanels()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="logo">🔥</div>
        <div>
          <h1>شات نار</h1>
          <p>واجهة عربية داكنة وعصرية</p>
        </div>
      </div>
      <button class="icon-btn" onclick="toggleSidebar(false)">✕</button>
    </div>

    <!-- باقي HTML زي ما هو عندك -->
  </aside>

  <div class="auth-modal" id="authModal">
    <!-- زي ما هو -->
  </div>

  <div class="app">
    <!-- زي ما هو -->
  </div>

  <!-- ✅ الحل هنا (الجزء المهم) -->
  <script>
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const authModal = document.getElementById("authModal");

    function toggleSidebar(open){
      if(open){
        sidebar.classList.add("open");
        overlay.classList.add("show");
      }else{
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
      }
    }

    function closeAllPanels(){
      toggleSidebar(false);
      closeAuth();
    }

    function openAuth(type){
      authModal.classList.add("show");
      overlay.classList.add("show");
      switchTab(type);
    }

    function closeAuth(){
      authModal.classList.remove("show");
      if(!sidebar.classList.contains("open")){
        overlay.classList.remove("show");
      }
    }

    function switchTab(type){
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const loginTab = document.getElementById("loginTab");
      const registerTab = document.getElementById("registerTab");

      if(type === "login"){
        loginForm.classList.add("active");
        registerForm.classList.remove("active");
        loginTab.classList.add("active");
        registerTab.classList.remove("active");
      }else{
        registerForm.classList.add("active");
        loginForm.classList.remove("active");
        registerTab.classList.add("active");
        loginTab.classList.remove("active");
      }
    }

    function setSection(name, el){
      document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("active"));
      el.classList.add("active");
    }
  </script>

</body>
</html>
