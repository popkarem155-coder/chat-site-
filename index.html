<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شات نار - نسخة مصححة</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#120018;
  --panel:#1c0026;
  --panel2:#240033;
  --accent:#9d2ec5;
  --gold:#ffcf40;
  --text:#fff;
  --muted:#b8b8c7;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Tahoma, Arial;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

.app{
  max-width:520px;
  margin:auto;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,#2a003b,#120018);
}

/* HEADER */
.header{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  background:var(--panel2);
  border-bottom:1px solid var(--border);
}

.title{color:var(--gold);font-weight:bold}

.icon{
  width:40px;height:40px;
  display:grid;place-items:center;
  background:var(--glass);
  border-radius:12px;
  cursor:pointer;
}

/* SEARCH */
.search{padding:10px;}
.search input{
  width:100%;
  padding:10px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--glass);
  color:#fff;
  outline:none;
}

/* CONTENT */
.content{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:12px;
}

.card h3{
  padding:8px;
  color:var(--gold);
  background:rgba(0,0,0,0.2);
}

.user{
  display:flex;
  gap:10px;
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.avatar{
  width:40px;height:40px;
  border-radius:10px;
  background:#333;
  border:2px solid var(--accent);
}

.status{color:#3dff7a;font-size:11px}

/* CHAT */
.chat{padding:10px}
.msg{
  margin:8px 0;
  padding:8px;
  background:rgba(255,255,255,0.05);
  border-radius:10px;
}

/* INPUT */
.footer{
  display:flex;
  gap:10px;
  padding:10px;
  background:var(--panel2);
  border-top:1px solid var(--border);
}

.footer input{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--glass);
  color:#fff;
  outline:none;
}

.send{
  width:42px;height:42px;
  border-radius:50%;
  background:var(--accent);
  border:none;
  color:#fff;
  cursor:pointer;
}

/* SIDEBAR */
.sidebar{
  position:absolute;
  top:0;
  width:260px;
  height:100%;
  background:var(--panel);
  padding:15px;
  transition:0.3s;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.left{right:-260px}
.right{left:-260px}

.active-left{right:0}
.active-right{left:0}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="icon" onclick="toggleSidebar('left')"><i class="fa fa-envelope"></i></div>
    <div class="title">🔥 شات نار</div>
    <div class="icon" onclick="toggleSidebar('right')"><i class="fa fa-user"></i></div>
  </div>

  <div class="search">
    <input placeholder="ابحث...">
  </div>

  <div class="content">

    <div class="card">
      <h3>المتصلين</h3>
      <div id="usersList"></div>
    </div>

    <div id="chatDisplay" class="chat"></div>

  </div>

  <div class="footer">
    <input id="mainInput" placeholder="اكتب رسالة...">
    <button class="send" onclick="sendMessage()"><i class="fa fa-paper-plane"></i></button>
  </div>

</div>

<!-- SIDEBARS -->
<div id="private-sidebar" class="sidebar left">
  <h3 style="color:var(--gold)">الرسائل</h3>
</div>

<div id="profile-sidebar" class="sidebar right">
  <h3 style="color:var(--gold)">الملف الشخصي</h3>
</div>

<div id="overlay" class="overlay" onclick="closeAllSidebars()"></div>

<script>

// SIDEBARS
function toggleSidebar(side){
  closeAllSidebars();

  const sidebar = document.getElementById(side === 'left' ? 'private-sidebar' : 'profile-sidebar');
  sidebar.classList.add(side === 'left' ? 'active-left' : 'active-right');

  document.getElementById('overlay').style.display='block';
}

function closeAllSidebars(){
  document.querySelectorAll('.sidebar').forEach(s=>{
    s.classList.remove('active-left','active-right');
  });
  document.getElementById('overlay').style.display='none';
}

// CHAT
function sendMessage(){
  const input = document.getElementById('mainInput');
  const chat = document.getElementById('chatDisplay');

  if(input.value.trim()!==""){
    chat.innerHTML += `<div class="msg">أنت: ${input.value}</div>`;
    input.value="";
    chat.scrollTop = chat.scrollHeight;
  }
}

// USERS
const users=[
  {name:"أحمد علي",status:"متصل"},
  {name:"سارة",status:"متصل"},
  {name:"كريم",status:"بعيد"}
];

const list=document.getElementById("usersList");

users.forEach(u=>{
  list.innerHTML += `
    <div class="user">
      <div class="avatar"></div>
      <div>
        <div>${u.name}</div>
        <div class="status">${u.status}</div>
      </div>
    </div>
  `;
});

document.getElementById('mainInput')
?.addEventListener('keypress',e=>{
  if(e.key==='Enter') sendMessage();
});

</script>

</body>
</html>
