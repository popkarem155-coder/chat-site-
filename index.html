<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>شات نار</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="app-shell">

<div id="app" class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <button id="privateShortcutBtn" class="icon-btn icon-btn-left">
      <span class="icon">☰</span>
    </button>

    <button id="appTitleBtn" class="brand-btn">
      <span class="brand-text">شات نار</span>
    </button>

    <button id="menuBtn" class="icon-btn icon-btn-right">
      <span class="icon">✉</span>
    </button>
  </header>

  <!-- HOME -->
  <section id="homeView" class="page is-active">

    <section class="status-strip">
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>زائر</span>
      </div>

      <input class="search-input" placeholder="ابحث عن مستخدم..." />
    </section>

    <main class="home-view">

      <section class="panel">
        <h2>المتصلين الآن</h2>
        <div class="online-users-wrapper"></div>
      </section>

      <section class="panel">
        <h2>المستخدمين المميزين</h2>
        <div class="featured-users-wrapper"></div>
      </section>

      <section class="panel chat-panel">
        <h2>الشات العام</h2>

        <div class="messages-stream"></div>

        <form class="composer">
          <input class="composer-input" placeholder="اكتب رسالة..." />
          <button class="composer-send">إرسال</button>
        </form>
      </section>

    </main>
  </section>

  <!-- PROFILE -->
  <section id="profileView" class="page is-hidden">
    <h2>البروفايل</h2>

    <div class="profile-card-block">
      <div class="avatar avatar-xl">؟</div>
      <p>تعديل البيانات</p>
    </div>

    <input placeholder="الاسم" />
    <input placeholder="السن" />

    <button>حفظ</button>
  </section>

  <!-- PRIVATE -->
  <section id="privateView" class="page is-hidden">

    <h2>الخاص</h2>

    <div class="private-chats-list"></div>

    <div class="messages-stream"></div>

    <form class="composer">
      <input class="composer-input" placeholder="رسالة خاصة..." />
      <button class="composer-send">إرسال</button>
    </form>

  </section>

</div>

<script src="main.js"></script>
</body>
</html>
