<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شات نار</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   1️⃣ CORE SYSTEM (THEME)
========================= */
:root{
  --bg: #0b0b12;
  --text: #ffffff;
  --border: rgba(255,255,255,0.08);

  --rose: #ff2d9b;
  --mauve: #7c3aed;

  --shadow-soft: 0 8px 18px rgba(0,0,0,0.3);
  --radius: 18px;
}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  color:var(--text);

  background:
  radial-gradient(circle at top right, rgba(255,45,155,0.15), transparent 30%),
  radial-gradient(circle at top left, rgba(124,58,237,0.15), transparent 30%),
  linear-gradient(180deg,#0b0b12,var(--bg));
}

/* =========================
   2️⃣ LAYOUT SYSTEM
========================= */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin:10px;
  padding:10px;
  border-radius:20px;

  background: rgba(255,255,255,0.05);
  border:1px solid var(--border);
  backdrop-filter: blur(12px);
}

.icon-btn{
  width:40px;
  height:40px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
}

.title{
  background:linear-gradient(45deg,var(--rose),var(--mauve));
  -webkit-background-clip:text;
  color:transparent;
}

/* =========================
   3️⃣ ROUTER BAR (TOP CONTROL)
========================= */
.router{
  display:flex;
  gap:8px;
  margin:10px;
  padding:10px;
  border-radius:16px;

  background: rgba(255,255,255,0.04);
  border:1px solid var(--border);
}

.tab{
  flex:1;
  text-align:center;
  padding:8px;
  border-radius:12px;
  cursor:pointer;

  background:rgba(255,255,255,0.03);
}

.tab.active{
  background:linear-gradient(45deg,var(--rose),var(--mauve));
}

/* =========================
   4️⃣ MODULE SYSTEM (SECTIONS)
========================= */
.section{
  margin:10px;
  padding:12px;

  border-radius:var(--radius);
  background: rgba(255,255,255,0.04);
  border:1px solid var(--border);
  box-shadow:var(--shadow-soft);
}

.user{
  padding:10px;
  margin-bottom:5px;
  border-radius:12px;
  background:rgba(255,255,255,0.04);
}

/* CHAT MODULE */
.chat-box{
  height:260px;
  overflow:auto;

  margin-bottom:12px;
  padding:10px;

  border-radius:16px;
  background: rgba(10,10,18,0.4);
  border:1px solid rgba(255,255,255,0.06);
}

.input-row{
  display:flex;
  gap:10px;
  padding:12px;

  border-radius:18px;
  background: rgba(20,20,30,0.6);
  border:1px solid rgba(255,255,255,0.10);
}

.input{
  flex:1;
  padding:12px;
  border-radius:14px;

  border:1px solid rgba(255,255,255,0.10);
  background: rgba(10,10,18,0.6);
  color:#fff;
}

.send{
  padding:10px 16px;
  border:none;
  border-radius:14px;

  background:linear-gradient(45deg,var(--rose),var(--mauve));
  color:#fff;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="icon-btn">☰</div>
  <div class="title">شات نار</div>
  <div class="icon-btn">💬</div>
</div>

<!-- ROUTER (CONTROL PANEL) -->
<div class="router">
  <div class="tab active">المتصلين</div>
  <div class="tab">مميزين</div>
  <div class="tab">الشات</div>
</div>

<!-- MODULE: ONLINE -->
<div class="section">
  <h3>المتصلون الآن</h3>
  <div class="user">مستخدم 1</div>
  <div class="user">مستخدم 2</div>
</div>

<!-- MODULE: FEATURED -->
<div class="section">
  <h3>المستخدمين المميزين</h3>
  <div class="user">مستخدم مميز</div>
</div>

<!-- MODULE: CHAT -->
<div class="section">
  <h3>الشات العام</h3>

  <div class="chat-box"></div>

  <div class="input-row">
    <input class="input chat-input" placeholder="اكتب رسالة...">
    <button class="send">إرسال</button>
  </div>
</div>

<script>
const chatInput = document.querySelector(".chat-input");
const sendBtn = document.querySelector(".send");
const chatBox = document.querySelector(".chat-box");

function sendMessage(){
  const text = chatInput.value.trim();
  if(!text) return;

  const msg = document.createElement("div");
  msg.className = "user";
  msg.textContent = text;

  chatBox.appendChild(msg);

  chatInput.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;
}

sendBtn.addEventListener("click", sendMessage);

chatInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
