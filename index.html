<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شات نار</title>

<style>
:root{
  /* الخلفية */
  --bg: #0c0c10;
  --bg-2: #12121a;

  /* البانلز */
  --panel: #171723;
  --panel-2: #1d1d2b;
  --panel-3: #232336;

  /* النصوص */
  --text: #f3f4f6;
  --muted: #a7a7bb;
  --soft: #8d8da8;

  /* الألوان الأساسية */
  --rose: #c2185b;
  --rose-2: #ad1457;

  --mauve: #7e57c2;
  --mauve-2: #5e35b1;

  /* الجلو (سر الاحتراف 👇) */
  --glow: rgba(126, 87, 194, 0.25);
  --glow-rose: rgba(194, 24, 91, 0.2);

  /* البوردر */
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);

  /* الظلال */
  --shadow: 0 16px 34px rgba(0, 0, 0, 0.4);
  --shadow-soft: 0 8px 18px rgba(0, 0, 0, 0.25);

  /* الزوايا */
  --radius: 18px;
  --radius-sm: 14px;
}

body{
  margin:0;
  background:
  radial-gradient(circle at top right, rgba(194,24,91,0.15), transparent 30%),
  radial-gradient(circle at top left, rgba(126,87,194,0.15), transparent 30%),
  linear-gradient(180deg,#0c0c10,var(--bg));
  color:var(--text);
  font-family:tahoma;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  margin:10px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);

backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
  border:1px solid var(--border);
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.05);
  cursor:pointer;
}

.title{
  font-weight:bold;
  background:linear-gradient(45deg,var(--rose),var(--mauve));
  -webkit-background-clip:text;
  color:transparent;
}

/* SECTIONS */
.section{
  margin:10px;
  padding:12px;
  border-radius:var(--radius);

  background: rgba(255,255,255,0.04); /* شفافية */

  border:1px solid var(--border);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow: var(--shadow-soft);
}

/* SEARCH */
.search{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:none;
  background: var(--bg-2);
  color:#fff;
}

/* USERS */
.user{
  padding:10px;
  margin-bottom:5px;
  border-radius:12px;
  background:rgba(255,255,255,0.04);
}

/* CHAT */
.chat-box{
  height:200px;
  overflow:auto;
  margin-bottom:10px;
}

.input-row{
  display:flex;
  gap:10px;
}

.input{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:none;
  background:#111;
  color:#fff;
}

.send{
  padding:10px 15px;
  border:none;
  border-radius:12px;
  background:linear-gradient(45deg,var(--rose),var(--mauve));
  color:#fff;
}
</style>

</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="icon-btn">💬</div>
  <div class="title">شات نار</div>
  <div class="icon-btn">☰</div>
</div>

<!-- SEARCH -->
<div class="section">
  <input class="search" placeholder="ابحث عن مستخدم...">
</div>

<!-- ONLINE -->
<div class="section">
  <h3>المتصلون الآن</h3>
  <div class="user">مستخدم 1</div>
  <div class="user">مستخدم 2</div>
</div>

<!-- FEATURED -->
<div class="section">
  <h3>المستخدمين المميزين</h3>
  <div class="user">مستخدم مميز</div>
</div>

<!-- CHAT -->
<div class="section">
  <h3>الشات العام</h3>

  <div class="chat-box"></div>

  <div class="input-row">
    <input class="input" placeholder="اكتب رسالة...">
    <button class="send">إرسال</button>
  </div>
</div>

</body>
</html>
