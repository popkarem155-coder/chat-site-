<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شات نار</title>

<!-- الخط -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="icon-btn">☰</div>
  <div class="title">شات نار</div>
  <div class="icon-btn">💬</div>
</div>

<!-- SEARCH -->
<div class="section">
  <form class="search-form" onsubmit="return false;">
    <input class="search" placeholder="ابحث عن مستخدم...">
  </form>
</div>

<!-- ONLINE -->
<div class="section">
  <h3>المتصلون الآن</h3>
  <div class="user">مستخدم 1</div>
  <div class="user">مستخدم 2</div>
</div>

<!-- FEATURED -->
<div class="section">
  <h3>المستخدمين المميزين</h3>
  <div class="user">مستخدم مميز</div>
</div>

<!-- CHAT -->
<div class="section">
  <h3>الشات العام</h3>

  <div class="chat-box"></div>

  <div class="input-row">
    <input class="input chat-input" placeholder="اكتب رسالة...">
    <button class="send">إرسال</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
