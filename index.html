<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شات نار</title>

<!-- الخط -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  /* الخلفية */
  --bg: #0b0b12;
  --bg-2: #11111a;

  /* البانلز */
  --panel: #11111a;
  --panel-2: #1a1a26;
  --panel-3: #232336;

  /* النصوص */
  --text: #ffffff;
  --muted: #a1a1aa;
  --soft: #71717a;

  /* الألوان الأساسية (ناري 🔥) */
  --rose: #ff2d9b;
  --rose-2: #ff4db2;

  --mauve: #7c3aed;
  --mauve-2: #5b21b6;

  /* الجلو */
  --glow: rgba(124, 58, 237, 0.25);
  --glow-rose: rgba(255, 45, 155, 0.25);

  /* البوردر */
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.15);

  /* الظلال */
  --shadow: 0 16px 34px rgba(0, 0, 0, 0.5);
  --shadow-soft: 0 8px 18px rgba(0, 0, 0, 0.3);

  /* الزوايا */
  --radius: 18px;
  --radius-sm: 14px;
}

body{
  margin:0;
  background:
  radial-gradient(circle at top right, rgba(255,45,155,0.15), transparent 30%),
  radial-gradient(circle at top left, rgba(124,58,237,0.15), transparent 30%),
  linear-gradient(180deg,#0b0b12,var(--bg));
  color:var(--text);
  font-family:"Cairo", sans-serif;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  margin:10px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border:1px solid var(--border);
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.05);
  cursor:pointer;
}

.title{
  font-weight:bold;
  background:linear-gradient(45deg,var(--rose),var(--mauve));
  -webkit-background-clip:text;
  color:transparent;
}

/* SECTIONS */
.section{
  margin:10px;
  padding:12px;
  border-radius:var(--radius);

  background: rgba(255,255,255,0.04);

  border:1px solid var(--border);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow: var(--shadow-soft);
}

/* SEARCH */
.search{
  width:100%;
  padding:12px 16px;
  border-radius:14px;

  background: transparent; 
  border:1px solid var(--border);

  color: var(--text);

  outline: none;
  box-sizing: border-box;
}

  .search:focus{
  border:1px solid var(--rose);
  box-shadow: 0 0 8px var(--glow-rose);
  }

/* USERS */
.user{
  padding:10px;
  margin-bottom:5px;
  border-radius:12px;
  background:rgba(255,255,255,0.04);
}

/* CHAT */
.chat-box{
  height:200px;
  overflow:auto;
  margin-bottom:10px;
}

.input-row{
  display:flex;
  gap:10px;
}

.input{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:none;
  background:#111;
  color:#fff;
}

.send{
  padding:10px 15px;
  border:none;
  border-radius:12px;
  background:linear-gradient(45deg,var(--rose),var(--mauve));
  color:#fff;
}
</style>

</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="icon-btn">☰</div>
  <div class="title">شات نار</div>
  <div class="icon-btn">💬</div>
</div>

<!-- SEARCH -->
<div class="section">
  <form class="search-form" onsubmit="return false;">
    <input class="search" placeholder="ابحث عن مستخدم...">
  </form>
</div>

<!-- ONLINE -->
<div class="section">
  <h3>المتصلون الآن</h3>
  <div class="user">مستخدم 1</div>
  <div class="user">مستخدم 2</div>
</div>

<!-- FEATURED -->
<div class="section">
  <h3>المستخدمين المميزين</h3>
  <div class="user">مستخدم مميز</div>
</div>

<!-- CHAT -->
<div class="section">
  <h3>الشات العام</h3>

  <div class="chat-box"></div>

  <div class="input-row">
    <input class="chat-input" placeholder="اكتب رسالة...">
    <button class="send">إرسال</button>
  </div>
</div>

<script>
  const chatInput = document.querySelector(".chat-input");
const sendBtn = document.querySelector(".send");

chatInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    sendBtn.click();
  }
});
</script>

</body>
</html>
