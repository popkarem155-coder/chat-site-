<!doctype html>

<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Chat Platform</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    html { height: 100%; }
    body { font-family: 'Noto Kufi Arabic', sans-serif; margin: 0; height: 100%; overflow: hidden; }
    #app { height: 100% !important; }
    .chat-bg {
      background: #0f0f1a;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(236, 72, 153, 0.06) 0%, transparent 50%);
    }
    .msg-enter { animation: msgSlide 0.3s ease-out; }
    @keyframes msgSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    .input-glow:focus { box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.4); }
    .modal-bg { background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); }
    .sidebar-item { transition: all 0.2s; }
    .sidebar-item:hover { background: #2a2a4a; }
    .sidebar-item.active { background: linear-gradient(135deg, #6366f1, #ec4899); color: white; }
  </style>
</head>
<body class="h-full">
  <div id="app" class="chat-bg w-screen h-screen flex flex-col overflow-hidden fixed inset-0"><!-- Login Modal -->
<div id="loginModal" class="modal-bg fixed inset-0 z-50 flex items-center justify-center p-4">
  <div style="background:#1a1a2e; border:1px solid #2a2a4a;" class="rounded-2xl p-6 w-full max-w-sm max-h-[95vh] overflow-y-auto">
    <div class="text-5xl mb-4 text-center">💬</div>
    <h2 class="text-white text-2xl font-bold mb-2 text-center">مرحباً بك</h2>
    <p class="text-gray-400 text-sm mb-6 text-center">سجل دخول أو إنشاء حساب جديد</p>
    <div class="space-y-3">
      <button id="guestBtn" class="w-full py-3 rounded-xl font-bold text-white" style="background:#10b981;">👤 دخول كزائر</button>
      <button id="toRegBtn" class="w-full py-3 rounded-xl font-bold text-white flex items-center justify-center gap-2" style="background:#4285f4;">🔗 دخول بحساب جوجال</button>
    </div>
    <div class="mt-4 pt-4 border-t border-gray-700">
      <label class="flex items-center gap-2 cursor-pointer justify-center text-gray-400 hover:text-white transition-colors">
        <input id="musicToggle" type="checkbox" class="w-4 h-4 cursor-pointer">
        <span class="text-sm">🎵 موسيقى عربية</span>
      </label>
    </div>
  </div>
</div>

<!-- Guest Registration Modal -->
<div id="guestRegModal" class="modal-bg fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
  <div style="background:#1a1a2e; border:1px solid #2a2a4a;" class="rounded-2xl p-6 w-full max-w-sm max-h-[95vh] overflow-y-auto">
    <h2 class="text-white text-2xl font-bold mb-2 text-center">دخول كزائر</h2>
    <form id="guestRegForm" class="space-y-3">
      <div>
        <label class="text-gray-300 text-sm block mb-1">اسمك</label>
        <input id="guestName" type="text" maxlength="30" required placeholder="أكتب اسمك" class="w-full px-3 py-2 rounded-xl bg-[#0f0f1a] border border-[#2a2a4a] text-white text-sm input-glow outline-none">
      </div>
      <div>
        <label class="text-gray-300 text-sm block mb-1">الجنس</label>
        <select id="guestGender" class="w-full px-3 py-2 rounded-xl bg-[#0f0f1a] border border-[#2a2a4a] text-white text-sm input-glow outline-none">
          <option value="">اختر</option>
          <option value="ذكر">ذكر</option>
          <option value="أنثى">أنثى</option>
        </select>
      </div>
      <div>
        <label class="text-gray-300 text-sm block mb-1">السن</label>
        <input id="guestAge" type="number" min="13" max="120" required placeholder="أدخل سنك" class="w-full px-3 py-2 rounded-xl bg-[#0f0f1a] border border-[#2a2a4a] text-white text-sm input-glow outline-none">
      </div>
      <div class="flex gap-2">
        <button type="button" id="backToLoginGuest" class="flex-1 px-3 py-2 rounded-xl font-bold text-white bg-gray-600 text-sm">رجوع</button>
        <button type="submit" class="flex-1 px-3 py-2 rounded-xl font-bold text-white text-sm" style="background: linear-gradient(135deg, #6366f1, #ec4899);">دخول</button>
      </div>
    </form>
  </div>
</div>

<!-- Google Registration Modal -->
<div id="googleRegModal" class="modal-bg fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
  <div style="background:#1a1a2e; border:1px solid #2a2a4a;" class="rounded-2xl p-6 w-full max-w-sm max-h-[95vh] overflow-y-auto text-center">
    <h2 class="text-white text-2xl font-bold mb-2">إنشاء حساب</h2>
    <p class="text-gray-400 text-sm mb-6">يرجى تسجيل الدخول بحساب جوجال</p>
    <button id="googleLoginBtn" class="w-full py-3 rounded-xl font-bold text-white flex items-center justify-center gap-2" style="background:#4285f4;">🔗 تسجيل دخول بجوجال</button>
    <button id="backToLoginGoogle" class="w-full mt-3 px-3 py-2 rounded-xl font-bold text-white bg-gray-600 text-sm">رجوع</button>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal-bg fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
  <div style="background:#1a1a2e; border:1px solid #2a2a4a;" class="rounded-2xl p-6 w-full max-w-sm">
    <h2 class="text-white text-2xl font-bold mb-4">⚙️ الإعدادات</h2>
    <div class="space-y-4">
      <button id="viewProfileBtn" class="w-full px-3 py-2 rounded-lg text-left text-white bg-[#2a2a4a] hover:bg-[#3a3a5a] text-sm">👤 عرض الملف الشخصي</button>
      <button id="logoutBtn" class="w-full px-3 py-2 rounded-lg font-bold text-white bg-red-600 hover:bg-red-700 text-sm">🚪 تسجيل الخروج</button>
      <button id="closeSettings" class="w-full px-3 py-2 rounded-lg font-bold text-white bg-gray-600 hover:bg-gray-700 text-sm">إغلاق</button>
    </div>
  </div>
</div>

<!-- Main Layout -->
<div class="flex flex-1 overflow-hidden relative">
  <div id="sidebarOverlay" class="hidden fixed inset-0 z-10 bg-black/50 lg:hidden"></div>

  <button id="toggleSidebar" class="absolute top-3 right-3 z-30 w-10 h-10 rounded-lg flex items-center justify-center text-white lg:hidden" style="background:#6366f1;">
    <i data-lucide="menu" style="width:20px;height:20px;"></i>
  </button>

  <!-- Sidebar -->
  <div id="sidebar" style="background:#1a1a2e; border-right:1px solid #2a2a4a;" class="w-72 flex flex-col fixed lg:static left-0 top-0 h-full z-20 lg:z-auto transform lg:transform-none transition-transform duration-200 -translate-x-full lg:translate-x-0">
    <div style="border-bottom:1px solid #2a2a4a;" class="p-3">
      <div class="flex items-center gap-2">
        <button id="closeSidebar" class="w-8 h-8 rounded-lg hover:bg-[#2a2a4a] text-gray-400 lg:hidden shrink-0">
          <i data-lucide="x" style="width:16px;height:16px;"></i>
        </button>
        <div id="profileAvatar" class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold" style="background: linear-gradient(135deg, #6366f1, #ec4899);">👤</div>
        <div class="flex-1 min-w-0">
          <p id="profileName" class="text-white font-bold text-sm truncate">المستخدم</p>
          <p class="text-gray-400 text-xs">نشط الآن</p>
        </div>
        <button id="settingsBtn" class="w-8 h-8 rounded-lg hover:bg-[#2a2a4a] text-gray-400">
          <i data-lucide="settings" style="width:16px;height:16px;"></i>
        </button>
      </div>
    </div>

    <div class="flex border-b border-[#2a2a4a] px-1 py-2 gap-1 text-xs">
      <button id="tabChats" class="sidebar-item active flex-1 px-2 py-1 rounded font-bold text-white">💬</button>
      <button id="tabGeneral" class="sidebar-item flex-1 px-2 py-1 rounded font-bold text-white">🌍</button>
      <button id="tabFriends" class="sidebar-item flex-1 px-2 py-1 rounded font-bold text-white">👥</button>
      <button id="tabGroups" class="sidebar-item flex-1 px-2 py-1 rounded font-bold text-white">👨</button>
      <button id="tabNotif" class="sidebar-item flex-1 px-2 py-1 rounded font-bold text-white relative">🔔 <span id="notifBadge" class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full hidden"></span></button>
    </div>

    <div class="flex-1 overflow-y-auto scrollbar-thin">
      <div id="chatsList" class="p-2 space-y-1"></div>
      <div id="generalChat" class="p-2 hidden">
        <div class="p-3 rounded-lg bg-gradient-to-r from-[#6366f1] to-[#ec4899] text-white font-bold text-sm mb-2">🌍 الشات العام</div>
        <p class="text-gray-400 text-xs p-2">جميع المستخدمين مرحب بهم هنا!</p>
      </div>
      <div id="friendsList" class="p-2 hidden">
        <button id="addFriendBtn" class="w-full px-2 py-1 rounded-lg mb-2 text-white text-xs font-bold" style="background: linear-gradient(135deg, #6366f1, #ec4899);">+ إضافة صديق</button>
        <div id="friendsContent" class="space-y-1"></div>
      </div>
      <div id="groupsList" class="p-2 hidden">
        <button id="createGroupBtn" class="w-full px-2 py-1 rounded-lg mb-2 text-white text-xs font-bold" style="background: linear-gradient(135deg, #6366f1, #ec4899);">+ إنشاء مجموعة</button>
        <div id="groupsContent" class="space-y-1"></div>
      </div>
      <div id="notifList" class="p-2 hidden">
        <div id="notifContent" class="space-y-1"></div>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="flex-1 flex flex-col">
    <header style="background:#1a1a2e; border-bottom:1px solid #2a2a4a;" class="px-4 py-3 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div id="chatAvatar" class="w-10 h-10 rounded-full flex items-center justify-center" style="background: linear-gradient(135deg, #6366f1, #ec4899);">💬</div>
        <div>
          <h1 id="chatName" class="text-white font-bold text-base">اختر محادثة</h1>
          <p id="chatStatus" class="text-gray-400 text-xs">ابدأ الآن</p>
        </div>
      </div>
    </header>

    <main id="messagesContainer" class="flex-1 overflow-y-auto scrollbar-thin p-4 space-y-3">
      <div id="emptyState" class="flex flex-col items-center justify-center h-full text-center opacity-50">
        <div class="text-5xl mb-3">🗨️</div>
        <p id="welcomeText" class="text-gray-400">مرحباً بك في مجتمعنا! 👋</p>
        <p class="text-gray-500 text-xs mt-1">اختر دردشة لبدء المحادثة</p>
      </div>
    </main>

    <footer style="background:#1a1a2e; border-top:1px solid #2a2a4a;" class="px-3 py-3 shrink-0">
      <form id="msgForm" class="flex items-center gap-2 flex-row-reverse">
        <input id="msgInput" type="text" maxlength="500" placeholder="اكتب رسالة..." disabled class="flex-1 px-4 py-3 rounded-xl bg-[#0f0f1a] border border-[#2a2a4a] text-white text-sm input-glow outline-none disabled:opacity-40">
        <button type="submit" id="sendBtn" disabled class="w-11 h-11 rounded-xl flex items-center justify-center text-white shrink-0 disabled:opacity-40" style="background: linear-gradient(135deg, #6366f1, #ec4899);">
          <i data-lucide="send" style="width:18px;height:18px;transform:scaleX(-1)"></i>
        </button>
      </form>
    </footer>
  </div>
</div>

  </div>  <audio id="bgMusic" loop style="display:none;">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>  <script>
    const COLORS = ['#6366f1','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#8b5cf6','#14b8a6'];
    const defaultConfig = {
      app_title: 'منصة الدردشة الاجتماعية',
      welcome_msg: 'مرحباً بك في مجتمعنا! 👋'
    };

    let currentUser = null;
    let currentUserId = null;
    let userColor = null;
    let currentChatId = 'general';
    let allUsers = [];
    let unsubMessages = null;

    // ===== Firebase =====
    const firebaseConfig = {
      apiKey: "PUT_YOUR_API_KEY_HERE",
      authDomain: "PUT_YOUR_AUTH_DOMAIN_HERE",
      projectId: "PUT_YOUR_PROJECT_ID_HERE",
      storageBucket: "PUT_YOUR_STORAGE_BUCKET_HERE",
      messagingSenderId: "PUT_YOUR_MESSAGING_SENDER_ID_HERE",
      appId: "PUT_YOUR_APP_ID_HERE"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    function setStatus(text) {
      document.getElementById('chatStatus').textContent = text;
    }

    function openApp() {
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('msgInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('chatName').textContent = '🌍 الشات العام';
      setStatus('متصل');
      listenMessages();
    }

    function listenMessages() {
      if (unsubMessages) unsubMessages();
      const q = db.collection('messages').orderBy('createdAt');
      unsubMessages = q.onSnapshot((snap) => {
        const box = document.getElementById('messagesContainer');
        const empty = document.getElementById('emptyState');
        let html = '';

        snap.forEach((doc) => {
          const m = doc.data();
          html += `
            <div class="msg-enter rounded-2xl p-3 border border-[#2a2a4a] bg-[#1a1a2e]">
              <div class="flex items-center justify-between gap-2 mb-1">
                <strong style="color:${m.color || '#ec4899'}" class="text-sm">${escapeHtml(m.name || 'مستخدم')}</strong>
                <span class="text-[10px] text-gray-500">${formatTime(m.time)}</span>
              </div>
              <div class="text-sm text-white leading-7 break-words">${escapeHtml(m.text || '')}</div>
            </div>`;
        });

        box.innerHTML = html || `
          <div id="emptyState" class="flex flex-col items-center justify-center h-full text-center opacity-50">
            <div class="text-5xl mb-3">🗨️</div>
            <p id="welcomeText" class="text-gray-400">مرحباً بك في مجتمعنا! 👋</p>
            <p class="text-gray-500 text-xs mt-1">اختر دردشة لبدء المحادثة</p>
          </div>`;
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatTime(value) {
      try {
        if (!value) return '';
        if (value.toDate) return value.toDate().toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
        return new Date(value).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
      } catch (_) {
        return '';
      }
    }

    async function loginGuestProfile() {
      const name = document.getElementById('guestName').value.trim();
      const gender = document.getElementById('guestGender').value;
      const age = document.getElementById('guestAge').value;
      if (!name || !gender || !age) return;

      await auth.signInAnonymously();
      const user = auth.currentUser;
      currentUser = user;
      currentUserId = user.uid;
      userColor = COLORS[Math.floor(Math.random() * COLORS.length)];

      await db.collection('profiles').doc(user.uid).set({
        name,
        gender,
        age,
        color: userColor,
        type: 'guest',
        uid: user.uid,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });

      document.getElementById('profileName').textContent = name + ' (زائر)';
      document.getElementById('profileAvatar').textContent = name.trim().charAt(0) || '👤';
      document.getElementById('guestRegModal').classList.add('hidden');
      openApp();
    }

    async function loginWithGoogle() {
      const result = await auth.signInWithPopup(googleProvider);
      const user = result.user;
      currentUser = user;
      currentUserId = user.uid;
      userColor = COLORS[Math.floor(Math.random() * COLORS.length)];

      await db.collection('profiles').doc(user.uid).set({
        name: user.displayName || 'مستخدم',
        email: user.email || '',
        color: userColor,
        type: 'google',
        uid: user.uid,
        photoURL: user.photoURL || '',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });

      document.getElementById('profileName').textContent = user.displayName || 'مستخدم';
      document.getElementById('profileAvatar').textContent = (user.displayName || 'م').charAt(0);
      document.getElementById('googleRegModal').classList.add('hidden');
      openApp();
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      if (!currentUser) return;

      db.collection('messages').add({
        text,
        name: document.getElementById('profileName').textContent.replace(' (زائر)', ''),
        uid: currentUserId,
        color: userColor || '#ec4899',
        time: Date.now(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      input.value = '';
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.add('hidden');
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.remove('hidden');
    }

    function switchTab(tab) {
      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      document.getElementById('chatsList').classList.add('hidden');
      document.getElementById('generalChat').classList.add('hidden');
      document.getElementById('friendsList').classList.add('hidden');
      document.getElementById('groupsList').classList.add('hidden');
      document.getElementById('notifList').classList.add('hidden');

      if (tab === 'tabChats') document.getElementById('chatsList').classList.remove('hidden');
      if (tab === 'tabGeneral') document.getElementById('generalChat').classList.remove('hidden');
      if (tab === 'tabFriends') document.getElementById('friendsList').classList.remove('hidden');
      if (tab === 'tabGroups') document.getElementById('groupsList').classList.remove('hidden');
      if (tab === 'tabNotif') document.getElementById('notifList').classList.remove('hidden');
    }

    function renderStaticLists() {
      document.getElementById('chatsList').innerHTML = `
        <div class="p-2 rounded-lg bg-[#0f0f1a] hover:bg-[#1e1e35] transition-all cursor-pointer">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-sm" style="background:#6366f1">A</div>
            <div class="flex-1 min-w-0"><p class="text-white text-xs font-bold truncate">شات عام</p><p class="text-gray-400 text-[10px]">الجميع</p></div>
          </div>
        </div>`;
      document.getElementById('friendsContent').innerHTML = '<p class="text-gray-400 text-xs p-2">لا توجد أصدقاء</p>';
      document.getElementById('groupsContent').innerHTML = '<p class="text-gray-400 text-xs p-2">لا توجد مجموعات</p>';
      document.getElementById('notifContent').innerHTML = '<p class="text-gray-400 text-xs p-2">لا توجد إشعارات</p>';
    }

    document.getElementById('msgForm').addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage();
    });

    document.getElementById('guestBtn').addEventListener('click', () => {
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('guestRegModal').classList.remove('hidden');
    });

    document.getElementById('toRegBtn').addEventListener('click', () => {
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('googleRegModal').classList.remove('hidden');
    });

    document.getElementById('backToLoginGuest').addEventListener('click', () => {
      document.getElementById('guestRegModal').classList.add('hidden');
      document.getElementById('loginModal').classList.remove('hidden');
    });

    document.getElementById('backToLoginGoogle').addEventListener('click', () => {
      document.getElementById('googleRegModal').classList.add('hidden');
      document.getElementById('loginModal').classList.remove('hidden');
    });

    document.getElementById('guestRegForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await loginGuestProfile();
      } catch (err) {
        alert('تأكد من تفعيل Anonymous Auth داخل Firebase');
        console.error(err);
      }
    });

    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      try {
        await loginWithGoogle();
      } catch (err) {
        alert('تأكد من تفعيل Google Sign-In داخل Firebase وأن الدومين مسموح');
        console.error(err);
      }
    });

    document.getElementById('settingsBtn').addEventListener('click', () => document.getElementById('settingsModal').classList.remove('hidden'));
    document.getElementById('closeSettings').addEventListener('click', () => document.getElementById('settingsModal').classList.add('hidden'));
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      document.getElementById('settingsModal').classList.add('hidden');
      try { await auth.signOut(); } catch (_) {}
      location.reload();
    });

    document.getElementById('toggleSidebar').addEventListener('click', openSidebar);
    document.getElementById('closeSidebar').addEventListener('click', closeSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

    document.getElementById('tabChats').addEventListener('click', () => switchTab('tabChats'));
    document.getElementById('tabGeneral').addEventListener('click', () => switchTab('tabGeneral'));
    document.getElementById('tabFriends').addEventListener('click', () => switchTab('tabFriends'));
    document.getElementById('tabGroups').addEventListener('click', () => switchTab('tabGroups'));
    document.getElementById('tabNotif').addEventListener('click', () => switchTab('tabNotif'));

    document.getElementById('musicToggle').addEventListener('change', (e) => {
      const bgMusic = document.getElementById('bgMusic');
      if (e.target.checked) bgMusic.play().catch(() => {});
      else bgMusic.pause();
    });

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        document.getElementById('loginModal').classList.remove('hidden');
        document.getElementById('msgInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        setStatus('ابدأ الآن');
        return;
      }

      currentUser = user;
      currentUserId = user.uid;
      const profileDoc = await db.collection('profiles').doc(user.uid).get();
      const profile = profileDoc.exists ? profileDoc.data() : {};
      const displayName = profile.name || user.displayName || 'المستخدم';
      userColor = profile.color || COLORS[Math.floor(Math.random() * COLORS.length)];

      document.getElementById('profileName').textContent = displayName;
      document.getElementById('profileAvatar').textContent = displayName.charAt(0) || '👤';
      document.getElementById('profileAvatar').style.background = `linear-gradient(135deg, ${userColor}, #ec4899)`;
      document.getElementById('chatAvatar').style.background = `linear-gradient(135deg, ${userColor}, #ec4899)`;
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('guestRegModal').classList.add('hidden');
      document.getElementById('googleRegModal').classList.add('hidden');
      document.getElementById('msgInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      setStatus('متصل');
      openApp();
    });

    renderStaticLists();
    lucide.createIcons();
  </script></body>
</html>
