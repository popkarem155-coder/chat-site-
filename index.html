<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات نار | الشات العربي الأول</title>
    <link rel="stylesheet" href="style.css">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="app-wrapper">
        <!-- الهيدر الاحترافي -->
        <header class="main-header">
            <div class="icon-btn left" onclick="toggleSidebar('private-sidebar')">
                <i class="fas fa-envelope"></i>
                <span class="badge">3</span>
            </div>
            <div class="logo">
                <img src="https://ibb.co" alt="logo" class="fire-icon">
                <span>شات نار</span>
            </div>
            <div class="icon-btn right" onclick="toggleSidebar('profile-sidebar')">
                <i class="fas fa-user-circle"></i>
            </div>
        </header>

        <!-- منطقة البحث -->
        <div class="search-container">
            <div class="search-box">
                <input type="text" placeholder="ابحث هنا ...">
                <i class="fas fa-search"></i>
            </div>
        </div>

        <!-- المحتوى الرئيسي (Scrollable) -->
        <main class="chat-body">
            <section class="section-block">
                <div class="section-header">
                    <span>المتصلين الآن</span>
                    <i class="fas fa-users"></i>
                </div>
                <div class="users-list" id="usersList">
                    <!-- سيتم ملؤه بالبرمجة أو يدوياً -->
                </div>
            </section>

            <section class="section-block vip-section">
                <div class="section-header">
                    <span>المستخدمين المميزين</span>
                    <i class="fas fa-star"></i>
                </div>
                <div class="vip-grid" id="vipGrid">
                    <!-- صور المميزين -->
                </div>
            </section>

            <div class="public-chat-area" id="chatDisplay">
                <!-- الرسائل العامة تظهر هنا -->
            </div>
        </main>

        <!-- منطقة الكتابة (تكملة الصورة) -->
        <footer class="input-area">
            <div class="input-wrapper">
                <button class="action-btn"><i class="fas fa-plus"></i></button>
                <input type="text" id="mainInput" placeholder="اكتب رسالتك العامة...">
                <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </footer>

        <!-- القوائم الجانبية (تفتح عند الطلب) -->
        <div id="private-sidebar" class="sidebar left-side">
            <div class="sidebar-header">الرسائل الخاصة <i class="fas fa-times" onclick="toggleSidebar('private-sidebar')"></i></div>
            <div class="sidebar-content">لا توجد رسائل جديدة</div>
        </div>

        <div id="profile-sidebar" class="sidebar right-side">
            <div class="sidebar-header">الملف الشخصي <i class="fas fa-times" onclick="toggleSidebar('profile-sidebar')"></i></div>
            <div class="sidebar-content profile-info">
                <img src="https://placeholder.com" class="profile-img">
                <h4>زائر ملك</h4>
                <button class="edit-btn">تعديل البيانات</button>
            </div>
        </div>
        
        <div class="overlay" id="overlay" onclick="closeAllSidebars()"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
