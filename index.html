<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شات نار</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   ROOT (الألوان والثوابت)
========================= */
:root{
  --bg: #0b0b12;
  --bg-2: #11111a;

  --panel: #11111a;
  --panel-2: #1a1a26;
  --panel-3: #232336;

  --text: #ffffff;
  --muted: #a1a1aa;

  --rose: #ff2d9b;
  --mauve: #7c3aed;

  --glow-rose: rgba(255, 45, 155, 0.25);

  --border: rgba(255, 255, 255, 0.08);

  --shadow-soft: 0 8px 18px rgba(0, 0, 0, 0.3);

  --radius: 18px;
}

/* =========================
   BASE (الصفحة)
========================= */
body{
  margin:0;
  background:
  radial-gradient(circle at top right, rgba(255,45,155,0.15), transparent 30%),
  radial-gradient(circle at top left, rgba(124,58,237,0.15), transparent 30%),
  linear-gradient(180deg,#0b0b12,var(--bg));

  color:var(--text);
  font-family:"Cairo", sans-serif;
}

/* =========================
   HEADER
========================= */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:10px;
  margin:10px;

  border-radius:20px;
  background: rgba(255,255,255,0.05);
  border:1px solid var(--border);
}

.icon-btn{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;
  background:rgba(255,255,255,0.05);
}

.title{
  font-weight:bold;
  background:linear-gradient(45deg,var(--rose),var(--mauve));
  -webkit-background-clip:text;
  color:transparent;
}

/* =========================
   SEARCH BAR
========================= */
.search{
  width:100%;
  padding:12px 16px;
  border-radius:14px;

  border:1px solid var(--border);
  background: transparent;
  color: var(--text);

  box-sizing: border-box;
  outline:none;
}

.search:focus{
  border-color:var(--rose);
  box-shadow:0 0 8px var(--glow-rose);
}

/* =========================
   SECTIONS (عام)
========================= */
.section{
  margin:10px;
  padding:12px;

  border-radius:var(--radius);
  background: rgba(255,255,255,0.04);
  border:1px solid var(--border);

  box-shadow: var(--shadow-soft);
}

/* =========================
   USERS (مشترك)
========================= */
.user{
  padding:10px;
  margin-bottom:5px;

  border-radius:12px;
  background:rgba(255,255,255,0.04);
}

/* =========================
   ONLINE USERS MODULE
========================= */
.online-users{}

/* =========================
   FEATURED USERS MODULE
========================= */
.featured-users{}

/* =========================
   GLOBAL CHAT MODULE
========================= */
.chat-box{
  height:260px;
  overflow-y:auto;

  margin-bottom:12px;
  padding:10px;

  border-radius:16px;
  background: rgba(10,10,18,0.4);

  border:1px solid rgba(255,255,255,0.06);
}

.input-row{
  display:flex;
  gap:10px;
  padding:12px;

  border-radius:18px;
  background: rgba(20,20,30,0.6);
  border:1px solid rgba(255,255,255,0.10);
}

.input{
  flex:1;
  padding:12px 14px;

  border-radius:14px;
  border:1px solid rgba(255,255,255,0.10);

  background: rgba(10,10,18,0.6);
  color:#fff;

  outline:none;
}

.input:focus{
  border-color:var(--rose);
  box-shadow:0 0 12px rgba(255,45,155,0.35);
}

.send{
  padding:10px 16px;

  border:none;
  border-radius:14px;

  background: linear-gradient(45deg,var(--rose),var(--mauve));
  color:#fff;

  cursor:pointer;
}

.send:active{
  transform: scale(0.95);
}

</style>
</head>

<body>

<!-- =========================
   HEADER MODULE
========================= -->
<div class="header">
  <div class="icon-btn">☰</div>
  <div class="title">شات نار</div>
  <div class="icon-btn">💬</div>
</div>

<!-- =========================
   SEARCH MODULE
========================= -->
<div class="section">
  <input class="search" placeholder="ابحث عن مستخدم...">
</div>

<!-- =========================
   ONLINE USERS MODULE
========================= -->
<div class="section online-users">
  <h3>المتصلون الآن</h3>
  <div class="user">مستخدم 1</div>
  <div class="user">مستخدم 2</div>
</div>

<!-- =========================
   FEATURED USERS MODULE
========================= -->
<div class="section featured-users">
  <h3>المستخدمين المميزين</h3>
  <div class="user">مستخدم مميز</div>
</div>

<!-- =========================
   GLOBAL CHAT MODULE
========================= -->
<div class="section">
  <h3>الشات العام</h3>

  <div class="chat-box"></div>

  <div class="input-row">
    <input class="input chat-input" placeholder="اكتب رسالة...">
    <button class="send">إرسال</button>
  </div>
</div>

<script>

const chatInput = document.querySelector(".chat-input");
const sendBtn = document.querySelector(".send");
const chatBox = document.querySelector(".chat-box");

function sendMessage(){
  const text = chatInput.value.trim();
  if(text === "") return;

  const msg = document.createElement("div");
  msg.className = "user";
  msg.textContent = text;

  chatBox.appendChild(msg);

  chatInput.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;
}

sendBtn.addEventListener("click", sendMessage);

chatInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    sendMessage();
  }
});

</script>

</body>
</html>
