<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شات نار | K3-Z</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app-shell">

    <!-- الهيدر -->
    <header class="app-header" id="appHeader">
      <div class="header-side header-left">
        <button id="menuBtn" class="icon-btn" aria-label="القائمة" title="القائمة">
          ☰
        </button>
      </div>

      <div class="header-center">
        <button id="privateChatBtn" class="icon-btn icon-btn-wide" aria-label="الشات الخاص" title="الشات الخاص">
          الشات الخاص
        </button>
      </div>

      <div class="header-side header-right">
        <span class="header-spacer" aria-hidden="true"></span>
      </div>
    </header>

    <!-- اسم المشروع تحت الهيدر -->
    <section class="brand-strip" id="brandStrip">
      <h1 class="brand-title">شات نار</h1>
      <p class="brand-subtitle">المحادثة الخاصة والعامة في مكان واحد</p>
    </section>

    <!-- شريط البحث -->
    <section class="search-row" id="searchRow">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="ابحث عن شخص أو رسالة..."
        autocomplete="off"
      />
    </section>

    <!-- المحتوى الرئيسي -->
    <main class="app-main" id="appMain">

      <!-- المتصلون الآن -->
      <section class="panel panel-online" id="onlinePanel">
        <div class="panel-header">
          <h2>المتصلون الآن</h2>
        </div>
        <div class="panel-body" id="onlineUsersList">
          <div class="status-pill user-chip">
            <strong>مستخدم تجريبي</strong>
            <span>متصل الآن</span>
          </div>
        </div>
      </section>

      <!-- المستخدمون المميزون -->
      <section class="panel panel-featured" id="featuredPanel">
        <div class="panel-header">
          <h2>المستخدمون المميزون</h2>
        </div>
        <div class="panel-body" id="featuredUsersList"></div>
      </section>

      <!-- الشات العام -->
      <section class="panel panel-chat" id="publicChatPanel">
        <div class="panel-header">
          <h2>الشات العام</h2>
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="message-bubble other">
            <div class="message-meta">
              <strong>شات نار</strong>
              <small>الآن</small>
            </div>
            <div class="message-text">أهلاً بك في الشات العام.</div>
          </div>
        </div>

        <div class="chat-composer">
          <input
            type="text"
            id="messageInput"
            class="message-input"
            placeholder="اكتب رسالة..."
            autocomplete="off"
          />
          <button id="sendBtn" class="send-btn">إرسال</button>
        </div>
      </section>
    </main>

    <!-- القائمة اليمنى -->
    <aside class="right-drawer" id="rightDrawer" aria-hidden="true">
      <div class="drawer-profile" id="drawerProfile">
        <div class="profile-avatar" id="profileAvatar">K</div>

        <div class="profile-meta">
          <div class="profile-name" id="profileName">K3-Z User</div>
          <div class="profile-sub" id="profileSub">الملف الشخصي</div>
        </div>

        <div class="profile-badge-wrap">
          <span class="profile-badge" id="profileBadge">0</span>
        </div>
      </div>

      <nav class="drawer-menu" id="drawerMenu">
        <button class="drawer-item" id="visitedMeBtn">
          <span>من زار ملفك</span>
        </button>

        <button class="drawer-item" id="appSettingsBtn">
          <span>إعدادات التطبيق</span>
        </button>

        <button class="drawer-item" id="logoutBtn">
          <span>تسجيل الخروج</span>
        </button>
      </nav>
    </aside>

    <!-- القائمة اليسرى: الشات الخاص -->
    <aside class="left-drawer" id="leftDrawer" aria-hidden="true">
      <div class="private-header">
        <span class="private-tag">شات نار</span>
        <h2 class="private-title">المحادثات الخاصة</h2>
      </div>

      <div class="private-conversations" id="privateConversations">
        <div class="private-item">
          <div class="private-avatar">A</div>
          <div class="private-meta">
            <strong>أحمد</strong>
            <span>آخر رسالة: منذ قليل</span>
          </div>
        </div>
      </div>

      <div class="private-search-wrap">
        <input
          type="search"
          id="privateSearchInput"
          class="private-search-input"
          placeholder="ابحث عن شخص..."
          autocomplete="off"
        />
      </div>
    </aside>

    <!-- طبقة الإغلاق -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
  </div>

  <!-- ترتيب التحميل -->
  <script src="stateManager.js" defer></script>
  <script src="k3-event-system.js" defer></script>
  <script src="firebase.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
