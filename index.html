<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شات نار</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
body{
  background:#0b0910;
  color:white;
  font-family:Arial;
}
.chat{
  max-width:600px;
  margin:40px auto;
}
.msg{
  background:#1d1628;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="chat">
  <h1 class="text-2xl mb-4">🔥 شات نار</h1>

  <div id="messages"></div>

  <div class="flex gap-2 mt-4">
    <input id="msgInput" class="flex-1 p-2 rounded text-black" placeholder="اكتب رسالة">
    <button onclick="sendMessage()" class="bg-pink-600 px-4 rounded">إرسال</button>
  </div>
</div>

<script>
/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyCNCq5bP_UVdQgXPr40lroIkiti5aMWyvw",
  authDomain: "chat-nar.firebaseapp.com",
  projectId: "chat-nar",
  storageBucket: "chat-nar.firebasestorage.app",
  messagingSenderId: "199917444253",
  appId: "1:199917444253:web:aef64b8f6cb812d8f2c874"
};

/* Init */
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* عرض الرسائل */
db.collection("messages")
.orderBy("createdAt")
.onSnapshot((snapshot)=>{
  const box = document.getElementById("messages");
  box.innerHTML = "";

  snapshot.forEach(doc=>{
    const data = doc.data();
    box.innerHTML += `
      <div class="msg">
        <b>${data.name || "مستخدم"}:</b>
        <p>${data.text}</p>
      </div>
    `;
  });
});

/* إرسال */
function sendMessage(){
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if(!text) return;

  db.collection("messages").add({
    text:text,
    name:"Kimo",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  input.value="";
}
</script>

</body>
</html>
