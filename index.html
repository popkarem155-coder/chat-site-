<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شات نار</title>

<!-- الخط -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  /* الخلفية */
  --bg: #0b0b12;
  --bg-2: #11111a;

  /* البانلز */
  --panel: #11111a;
  --panel-2: #1a1a26;
  --panel-3: #232336;

  /* النصوص */
  --text: #ffffff;
  --muted: #a1a1aa;
  --soft: #71717a;

  /* الألوان الأساسية (ناري 🔥) */
  --rose: #ff2d9b;
  --rose-2: #ff4db2;

  --mauve: #7c3aed;
  --mauve-2: #5b21b6;

  /* الجلو */
  --glow: rgba(124, 58, 237, 0.25);
  --glow-rose: rgba(255, 45, 155, 0.25);

  /* البوردر */
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.15);

  /* الظلال */
  --shadow: 0 16px 34px rgba(0, 0, 0, 0.5);
  --shadow-soft: 0 8px 18px rgba(0, 0, 0, 0.3);

  /* الزوايا */
  --radius: 18px;
  --radius-sm: 14px;
}

body{
  margin:0;
  background:
  radial-gradient(circle at top right, rgba(255,45,155,0.15), transparent 30%),
  radial-gradient(circle at top left, rgba(124,58,237,0.15), transparent 30%),
  linear-gradient(180deg,#0b0b12,var(--bg));
  color:var(--text);
  font-family:"Cairo", sans-serif;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  margin:10px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border:1px solid var(--border);
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.05);
  cursor:pointer;
}

.title{
  font-weight:bold;
  background:linear-gradient(45deg,var(--rose),var(--mauve));
  -webkit-background-clip:text;
  color:transparent;
}

/* SECTIONS */
.section{
  margin:10px;
  padding:12px;
  border-radius:var(--radius);

  background: rgba(255,255,255,0.04);

  border:1px solid var(--border);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow: var(--shadow-soft);
}

/* SEARCH */
.search{
  width:100%;
  padding:12px 16px;
  border-radius:14px;

  background: transparent; 
  border:1px solid var(--border);

  color: var(--text);

  outline: none;
  box-sizing: border-box;
}

  .search:focus{
  border:1px solid var(--rose);
  box-shadow: 0 0 8px var(--glow-rose);
  }

/* USERS */
.user{
  padding:10px;
  margin-bottom:5px;
  border-radius:12px;
  background:rgba(255,255,255,0.04);
}

/* CHAT */
.chat-box{
  height:260px;
  overflow-y:auto;

  margin-bottom:12px;
  padding:10px;

  border-radius:16px;

  background: rgba(10,10,18,0.4);

  border:1px solid rgba(255,255,255,0.06);
}

/* ✨ شريط الكتابة (تصميم حديث بدون تغيير الهيكل) */
.input-row{
  display:flex;
  gap:10px;
  padding:12px;

  border-radius:18px;

  background: rgba(20,20,30,0.6);
  border:1px solid rgba(255,255,255,0.10);

  box-shadow: 0 10px 25px rgba(0,0,0,0.3);

  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

/* ✨ input حديث */
.input{
  flex:1;
  padding:12px 14px;

  border-radius:14px;

  border:1px solid rgba(255,255,255,0.10);
  background: rgba(10,10,18,0.6);

  color:#fff;
  outline:none;

  transition:0.25s ease;
}

/* ✨ عند الكتابة */
.input:focus{
  border-color: var(--rose);
  box-shadow: 0 0 12px rgba(255,45,155,0.35);
}

/* 🔥 زر الإرسال */
.send{
  padding:10px 16px;

  border:none;
  border-radius:14px;

  background: linear-gradient(45deg, var(--rose), var(--mauve));
  color:#fff;

  cursor:pointer;

  transition:0.2s ease;
}

/* 👇 إحساس الضغط */
.send:active{
  transform: scale(0.95);
}
</style>

</head>
<body>

<!-- HEADER -->
<div class="header">

  <div class="icon-btn" onclick="openMenu()" title="القائمة">☰</div>

  <div class="title">شات نار</div>

  <div class="icon-btn" onclick="navigate('dm')" title="الرسائل">💬</div>

</div>

<script>

/* =========================
   ☰ MENU
========================= */
function openMenu(){
  console.log("Menu opened");
  // هنا هيتضاف Sidebar لاحقًا
}

/* =========================
   🚀 NAVIGATION SYSTEM
========================= */
function navigate(page){

  const routes = {
  dm: "./dm.html",
  home: "./home.html",
  profile: "./profile.html"
};

  const target = routes[page];

  if(target){
    // تأثير بسيط قبل الانتقال (احترافي)
    document.body.style.transition = "0.2s";
    document.body.style.opacity = "0.5";

    setTimeout(()=>{
      window.location.href = target;
    }, 150);

  } else {
    console.warn("Route not found:", page);
  }

}

</script>
<!-- SEARCH -->
<div class="section">
  <form class="search-form" onsubmit="return false;">
    <input class="search" placeholder="ابحث عن مستخدم...">
  </form>
</div>

<!-- ONLINE -->
<div class="section">
  <h3>المتصلون الآن</h3>
  <div class="user">مستخدم 1</div>
  <div class="user">مستخدم 2</div>
</div>

<!-- FEATURED -->
<div class="section">
  <h3>المستخدمين المميزين</h3>
  <div class="user">مستخدم مميز</div>
</div>

<!-- CHAT -->
<div class="section">
  <h3>الشات العام</h3>

  <div class="chat-box"></div>

  <div class="input-row">
    <input class="input chat-input" placeholder="اكتب رسالة...">
    <button class="send">إرسال</button>
  </div>
</div>

<script>
const chatInput = document.querySelector(".chat-input");
const sendBtn = document.querySelector(".send");
const chatBox = document.querySelector(".chat-box");

function sendMessage(){
  const text = chatInput.value.trim();

  if(text === "") return;

  const msg = document.createElement("div");
  msg.className = "user";
  msg.textContent = text;

  chatBox.appendChild(msg);

chatInput.value = "";

chatBox.scrollTop = chatBox.scrollHeight;

chatInput.focus();
}

sendBtn.addEventListener("touchend", function(e){
  e.preventDefault();
  sendMessage();
});

chatInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
