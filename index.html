<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>شات نار</title>

<style>
:root{
  --bg:#0b0910;
  --bg2:#130e18;
  --panel:#171320;
  --panel2:#1d1628;
  --line:#3a2742;
  --accent:#ff4f9a;
  --accent2:#c32773;
  --text:#f8f1ff;
  --muted:#b6a9c3;
  --shadow:0 16px 40px rgba(0,0,0,.42);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Tahoma,Segoe UI,sans-serif;
}

body{
  background:linear-gradient(180deg,#120d18,#09070d);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* TOP BAR */
.top-alert{
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:rgba(255,79,154,.12);
  border-bottom:1px solid rgba(255,255,255,.06);
  position:relative;
}

.close-small{
  position:absolute;
  right:10px;
  background:none;
  border:none;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  opacity:0;
  visibility:hidden;
  transition:.2s;
}
.overlay.show{
  opacity:1;
  visibility:visible;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:44px;
  right:0;
  width:280px;
  height:100%;
  background:var(--panel);
  transform:translateX(100%);
  transition:.3s;
  z-index:50;
}
.sidebar.open{
  transform:translateX(0);
}

/* HEADER BUTTON */
.icon-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,.06);
  color:white;
  cursor:pointer;
}

/* AUTH MODAL */
.auth-modal{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(.9);
  background:var(--panel2);
  width:90%;
  max-width:400px;
  padding:20px;
  border-radius:15px;
  opacity:0;
  visibility:hidden;
  transition:.2s;
  z-index:100;
}
.auth-modal.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,-50%) scale(1);
}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{width:85%;}
}
</style>
</head>

<body>

<div class="top-alert" id="topAlert">
  <span>🔔 سجّل حسابك ليتم تفعيل المميزات</span>
  <button class="close-small" onclick="document.getElementById('topAlert').style.display='none'">×</button>
</div>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<aside class="sidebar" id="sidebar">
  <div style="padding:20px;">
    <h2>🔥 شات نار</h2>
    <p style="color:#aaa">قائمة الدردشة</p>
    <button onclick="toggleSidebar(false)">إغلاق</button>
  </div>
</aside>

<div class="auth-modal" id="authModal">
  <h3>تسجيل الدخول</h3>
  <input placeholder="اسم المستخدم" />
  <button>دخول</button>
</div>

<div style="padding:20px;">
  <button class="icon-btn" onclick="toggleSidebar(true)">☰</button>
  <button class="icon-btn" onclick="openAuth()">👤</button>
</div>

<script>
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const authModal = document.getElementById("authModal");

function toggleSidebar(open){
  if(open){
    sidebar.classList.add("open");
    overlay.classList.add("show");
  }else{
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
  }
}

function openAuth(){
  authModal.classList.add("show");
  overlay.classList.add("show");
}

function closeAll(){
  toggleSidebar(false);
  authModal.classList.remove("show");
  overlay.classList.remove("show");
}
</script>

</body>
</html>
