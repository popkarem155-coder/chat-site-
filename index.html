<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>كريم 1 - شات نار</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Tahoma, Arial, sans-serif;
      background: #0f0f1a;
      color: #fff;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      padding: 0 16px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
    }

    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .msg {
      background: #1e1e35;
      padding: 12px 14px;
      border-radius: 14px;
      max-width: 75%;
      word-break: break-word;
      line-height: 1.7;
    }

    .msg small {
      display: block;
      color: #a8a8b8;
      font-size: 11px;
      margin-bottom: 4px;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4a;
      flex-shrink: 0;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #2a2a4a;
      background: #0f0f1a;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <header>🔥 شات نار - كريم 1</header>

  <div class="chat-wrap">
    <div id="messages"></div>

    <form id="msgForm">
      <input id="msgInput" type="text" placeholder="اكتب رسالة..." />
      <button type="submit">إرسال</button>
    </form>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
