<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>شات نار</title>

  <style>
    :root{
      --bg:#0b0910;
      --bg2:#120d18;
      --panel:#171320;
      --accent:#ff4f9a;
      --accent2:#c32773;
      --text:#f8f1ff;
      --muted:#b6a9c3;
      --radius:18px;
    }

    *{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma;}

    body{
      background: radial-gradient(circle at top,#1a0f22,#0b0910);
      color:var(--text);
      min-height:100vh;
    }

    /* HEADER */
    header{
      padding:15px;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      text-align:center;
      font-weight:bold;
    }

    /* LAYOUT */
    .container{
      display:flex;
      height:calc(100vh - 50px);
    }

    /* SIDEBAR */
    .sidebar{
      width:260px;
      background:var(--panel);
      padding:15px;
      overflow:auto;
    }

    .user{
      padding:10px;
      background:#20172a;
      border-radius:12px;
      margin-bottom:10px;
    }

    .btn{
      width:100%;
      padding:10px;
      margin-top:8px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      background:var(--accent);
      color:white;
    }

    /* CHAT */
    .chat{
      flex:1;
      display:flex;
      flex-direction:column;
    }

    .messages{
      flex:1;
      padding:15px;
      overflow:auto;
    }

    .msg{
      background:#1d1426;
      padding:10px;
      margin-bottom:10px;
      border-radius:12px;
    }

    .inputBox{
      display:flex;
      padding:10px;
      background:#140f1c;
    }

    input{
      flex:1;
      padding:10px;
      border:none;
      border-radius:12px;
      outline:none;
      background:#22182f;
      color:white;
    }

    button.send{
      margin-right:10px;
      padding:10px 15px;
      border:none;
      border-radius:12px;
      background:var(--accent);
      color:white;
      cursor:pointer;
    }

    /* LOGIN */
    .login{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.8);
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .box{
      background:#1a1323;
      padding:20px;
      border-radius:15px;
      width:300px;
      text-align:center;
    }

    .box input{
      width:100%;
      margin-top:10px;
    }
  </style>
</head>

<body>

<header>🔥 شات نار</header>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="user">
      <div id="username">زائر</div>
    </div>
    <button class="btn" onclick="logout()">تسجيل خروج</button>
  </div>

  <!-- CHAT -->
  <div class="chat">
    <div class="messages" id="messages"></div>

    <div class="inputBox">
      <input id="msgInput" placeholder="اكتب رسالة..." />
      <button class="send" onclick="sendMsg()">إرسال</button>
    </div>
  </div>

</div>

<!-- LOGIN -->
<div class="login" id="loginBox">
  <div class="box">
    <h3>دخول</h3>
    <input id="nameInput" placeholder="اكتب اسمك"/>
    <button class="btn" onclick="login()">دخول الشات</button>
  </div>
</div>

<script>
  let user = "";

  function login(){
    user = document.getElementById("nameInput").value;
    if(!user) return;

    document.getElementById("username").innerText = user;
    document.getElementById("loginBox").style.display = "none";
  }

  function logout(){
    location.reload();
  }

  function sendMsg(){
    let input = document.getElementById("msgInput");
    if(!input.value) return;

    let div = document.createElement("div");
    div.className = "msg";
    div.innerText = user + ": " + input.value;

    document.getElementById("messages").appendChild(div);
    input.value = "";
  }
</script>

</body>
</html>
