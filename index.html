<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بدر 2</title>

<style>
:root{
  --bg:#0b0c10;
  --panel:#12131a;
  --panel-2:#161824;

  --text:#f5f6fa;
  --muted:#9aa3b2;

  --border:rgba(255,255,255,0.06);

  --rose:#e91e63;
  --mauve:#7c4dff;

  --radius:16px;
}

*{
  box-sizing:border-box;
  font-family:system-ui, Tahoma;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  position:sticky;
  top:0;

  display:grid;
  grid-template-columns:44px 1fr 44px;
  align-items:center;

  padding:10px;

  background:rgba(18,19,26,0.85);
  backdrop-filter:blur(10px);

  border-bottom:1px solid var(--border);
}

.btn{
  width:38px;
  height:38px;
  border-radius:12px;

  border:1px solid var(--border);
  background:linear-gradient(135deg,var(--rose),var(--mauve));
  color:white;

  cursor:pointer;
}

.title{
  text-align:center;
  font-weight:700;
  font-size:15px;
}

/* SEARCH */
.search{
  padding:10px;
}

.search input{
  width:100%;
  padding:12px;

  border-radius:14px;
  border:1px solid var(--border);

  background:var(--panel);
  color:var(--text);

  outline:none;
}

.search input:focus{
  border-color:rgba(124,77,255,0.5);
}

/* SECTION */
.section{
  margin:10px;
  padding:12px;

  border-radius:var(--radius);
  background:var(--panel);

  border:1px solid var(--border);
}

.section h3{
  margin:0 0 10px;
  font-size:13px;
  color:var(--muted);
}

/* USER ITEM (Telegram style) */
.item{
  display:flex;
  align-items:center;
  gap:10px;

  padding:10px;
  border-radius:14px;

  transition:0.15s;
  cursor:pointer;
}

.item:hover{
  background:rgba(255,255,255,0.03);
}

.avatar{
  width:38px;
  height:38px;
  border-radius:14px;

  background:linear-gradient(135deg,var(--rose),var(--mauve));

  display:grid;
  place-items:center;
  font-weight:700;
}

.info{
  flex:1;
  min-width:0;
}

.name{
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sub{
  font-size:12px;
  color:var(--muted);
}

/* DRAWER */
.drawer{
  position:fixed;
  top:0;
  right:-300px;

  width:280px;
  height:100%;

  background:var(--panel);

  border-left:1px solid var(--border);

  padding:12px;

  transition:0.25s;
}

.drawer.open{
  right:0;
}

.menu{
  margin-top:10px;
}

.menu div{
  padding:12px;
  margin:6px 0;

  border-radius:12px;
  background:var(--panel-2);
  border:1px solid var(--border);

  cursor:pointer;
}

.menu div:hover{
  background:rgba(233,30,99,0.08);
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <button class="btn">💬</button>
  <div class="title">بدر 2</div>
  <button class="btn" onclick="toggle()">☰</button>
</div>

<!-- SEARCH -->
<div class="search">
  <input placeholder="ابحث عن مستخدم...">
</div>

<!-- ONLINE -->
<div class="section">
  <h3>🟢 المتصلين الآن</h3>

  <div class="item">
    <div class="avatar">أ</div>
    <div class="info">
      <div class="name">أحمد</div>
      <div class="sub">متصل الآن</div>
    </div>
  </div>

  <div class="item">
    <div class="avatar">م</div>
    <div class="info">
      <div class="name">محمد</div>
      <div class="sub">منذ دقيقة</div>
    </div>
  </div>
</div>

<!-- FEATURED -->
<div class="section">
  <h3>⭐ المميزين</h3>

  <div class="item">
    <div class="avatar">س</div>
    <div class="info">
      <div class="name">سارة</div>
      <div class="sub">أكثر من ساعتين</div>
    </div>
  </div>
</div>

<!-- CHAT -->
<div class="section">
  <h3>💬 الشات العام</h3>

  <div class="item">
    <div class="avatar">👋</div>
    <div class="info">
      <div class="name">رسالة عامة</div>
      <div class="sub">أهلاً بيكم في بدر 2</div>
    </div>
  </div>
</div>

<!-- DRAWER -->
<div class="drawer" id="d">
  <h3>القائمة</h3>

  <div class="menu">
    <div>👤 البروفايل</div>
    <div>🔔 الإشعارات</div>
    <div>⚙️ الإعدادات</div>
    <div>🚪 خروج</div>
  </div>
</div>

<script>
function toggle(){
  document.getElementById('d').classList.toggle('open');
}
</script>

</body>
</html>
