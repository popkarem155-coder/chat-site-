<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>شات نار - Home</title>

<style>
:root{
  --bg:#0e0e12;
  --panel:#171723;
  --text:#f3f4f6;
  --muted:#a7a7bb;

  --rose:#c2185b;
  --mauve:#7e57c2;

  --border:rgba(255,255,255,0.08);
  --radius:18px;
}

*{box-sizing:border-box;font-family:tahoma}
body{
  margin:0;
  background:linear-gradient(180deg,#0c0c10,var(--bg));
  color:var(--text);
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:10;
  display:grid;
  grid-template-columns:50px 1fr 50px;
  align-items:center;
  padding:10px;
  background:rgba(23,23,35,0.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid var(--border);
  background:linear-gradient(135deg,var(--rose),var(--mauve));
  color:white;
  cursor:pointer;
}

.title{
  text-align:center;
  font-weight:bold;
}

/* SEARCH */
.search{
  margin:10px;
}
.search input{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
}

/* SECTIONS */
.section{
  margin:10px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--panel);
}

.section h3{
  margin:0 0 10px;
  font-size:14px;
  color:var(--muted);
}

.user{
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,0.03);
  margin-bottom:6px;
}

/* DRAWER */
.drawer{
  position:fixed;
  top:0;
  right:-300px;
  width:280px;
  height:100%;
  background:var(--panel);
  border-left:1px solid var(--border);
  transition:0.3s;
  padding:15px;
  z-index:20;
}

.drawer.open{
  right:0;
}

.drawer h3{
  margin-top:0;
}

.menu-item{
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid var(--border);
  cursor:pointer;
}
.menu-item:hover{
  background:rgba(194,24,91,0.1);
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <button class="icon-btn" onclick="goChat()">💬</button>
  <div class="title">🔥 شات نار</div>
  <button class="icon-btn" onclick="toggleDrawer()">☰</button>
</header>

<!-- SEARCH -->
<div class="search">
  <input type="text" placeholder="ابحث عن مستخدم...">
</div>

<!-- ONLINE USERS -->
<div class="section">
  <h3>🟢 المتصلين الآن</h3>
  <div class="user">أحمد - الآن</div>
  <div class="user">محمد - منذ دقيقة</div>
</div>

<!-- FEATURED -->
<div class="section">
  <h3>⭐ المستخدمين المميزين</h3>
  <div class="user">سارة - 3 ساعات</div>
  <div class="user">علي - 2 ساعة</div>
</div>

<!-- PUBLIC CHAT -->
<div class="section">
  <h3>💬 الشات العام</h3>
  <div class="user">أهلاً بيكم 👋</div>
  <div class="user">الموقع شغال!</div>
</div>

<!-- DRAWER -->
<div class="drawer" id="drawer">
  <h3>القائمة</h3>

  <div class="menu-item">👤 البروفايل</div>
  <div class="menu-item">🔔 الإشعارات</div>
  <div class="menu-item">⚙️ الإعدادات</div>
  <div class="menu-item">🚪 تسجيل الخروج</div>
</div>

<script>
function toggleDrawer(){
  document.getElementById("drawer").classList.toggle("open");
}

function goChat(){
  // لاحقًا هيفتح chat.html
  alert("هتروح لصفحة الشات الخاص");
}
</script>

</body>
</html>
