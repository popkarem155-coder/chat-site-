<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>شات نار</title>

  <style>
    body { margin:0; font-family:Arial; background:#0b0910; color:#fff; }
    .hidden { display:none; }
  </style>
</head>

<body>

<div id="overlay"></div>

<!-- AUTH -->
<div id="authModal">
  <div>
    <form id="loginForm">
      <input id="loginUser" placeholder="اسم المستخدم أو البريد" />
      <input id="loginPass" type="password" placeholder="كلمة المرور" />
      <button type="button" onclick="loginWithEmail()">دخول</button>
    </form>

    <form id="registerForm">
      <input id="registerName" placeholder="الاسم" />
      <input id="registerUsername" placeholder="اسم المستخدم" />
      <input id="registerEmail" placeholder="البريد" />
      <input id="registerPass" type="password" placeholder="كلمة المرور" />
      <button type="button" onclick="registerWithEmail()">إنشاء</button>
    </form>

    <div id="authStatus">جاهز</div>
  </div>
</div>

<!-- APP -->
<div id="app">

  <button onclick="toggleSidebar(true)">☰</button>

  <section id="important" class="section active">
    <h2>شات نار</h2>
  </section>

  <section id="messages" class="section">
    <div id="publicMessages"></div>

    <input id="publicMessageInput" placeholder="رسالة..." />
    <button onclick="sendPublicMessage()">إرسال</button>
  </section>

  <section id="rooms" class="section">
    <input id="roomNameInput" placeholder="اسم الغرفة" />
    <input id="roomDescInput" placeholder="الوصف" />
    <button onclick="createRoom()">إنشاء</button>

    <div id="roomList"></div>
  </section>

</div>

<script type="module">
/* ================= FIREBASE ================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  getDocs,
  where,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ================= CONFIG ================= */

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= STATE ================= */

let currentUser = null;

/* ================= HELPERS ================= */

const $ = (id) => document.getElementById(id);

function setStatus(msg) {
  $("authStatus").textContent = msg;
}

function normalize(u) {
  return u.trim().toLowerCase().replace(/\s+/g, "_");
}

/* ================= AUTH ================= */

async function registerWithEmail() {
  try {
    const name = $("registerName").value;
    const username = normalize($("registerUsername").value);
    const email = $("registerEmail").value;
    const pass = $("registerPass").value;

    const cred = await createUserWithEmailAndPassword(auth, email, pass);

    await updateProfile(cred.user, { displayName: name });

    await setDoc(doc(db, "users", cred.user.uid), {
      uid: cred.user.uid,
      displayName: name,
      username,
      email,
      isOnline: true,
      createdAt: serverTimestamp()
    });

    setStatus("تم إنشاء الحساب");
  } catch (e) {
    setStatus(e.message);
  }
}

async function loginWithEmail() {
  try {
    const input = $("loginUser").value;
    const pass = $("loginPass").value;

    let email = input;

    if (!input.includes("@")) {
      const snap = await getDocs(
        query(collection(db, "users"), where("username", "==", normalize(input)))
      );

      if (snap.empty) throw new Error("user not found");
      email = snap.docs[0].data().email;
    }

    await signInWithEmailAndPassword(auth, email, pass);
    setStatus("تم تسجيل الدخول");
  } catch (e) {
    setStatus(e.message);
  }
}

/* ================= MESSAGES ================= */

async function sendPublicMessage() {
  if (!auth.currentUser) return;

  const text = $("publicMessageInput").value;
  if (!text) return;

  await addDoc(collection(db, "publicMessages"), {
    text,
    uid: auth.currentUser.uid,
    createdAt: serverTimestamp()
  });

  $("publicMessageInput").value = "";
}

function loadMessages() {
  const q = query(collection(db, "publicMessages"), orderBy("createdAt"));

  onSnapshot(q, (snap) => {
    $("publicMessages").innerHTML = snap.docs.map(d =>
      `<div>👤 ${d.data().text}</div>`
    ).join("");
  });
}

/* ================= ROOMS ================= */

async function createRoom() {
  const name = $("roomNameInput").value;
  const desc = $("roomDescInput").value;

  await addDoc(collection(db, "rooms"), {
    name,
    desc,
    createdAt: serverTimestamp()
  });
}

/* ================= AUTH STATE ================= */

onAuthStateChanged(auth, (user) => {
  currentUser = user;

  if (user) {
    setDoc(doc(db, "users", user.uid), { isOnline: true }, { merge: true });
  }
});

/* ================= EXPORT ================= */

window.registerWithEmail = registerWithEmail;
window.loginWithEmail = loginWithEmail;
window.sendPublicMessage = sendPublicMessage;
window.createRoom = createRoom;

/* ================= INIT ================= */

loadMessages();

</script>

</body>
</html>
